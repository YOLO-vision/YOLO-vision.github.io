<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="フットサルボールと電子回路のイラスト">
  <!-- SVG は「線や丸を数字で指定して描く」画像。拡大してもぼやけない -->
  <defs>
    <!-- 背景：藍色から紫へ変わる色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f5bd5"/>
      <stop offset="1" stop-color="#9b6bd8"/>
    </linearGradient>
    <!-- ボールの模様を、ボールの丸の中だけに描くための型 -->
    <clipPath id="ball">
      <circle cx="84" cy="100" r="50"/>
    </clipPath>
  </defs>

  <!-- 背景の丸 -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- ===== 電子回路の線（ボールの右側から伸びる） ===== -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
    <polyline points="128,78 146,78 158,62 172,62"/>
    <polyline points="133,100 176,100"/>
    <polyline points="128,122 146,122 158,138 172,138"/>
    <polyline points="118,58 130,46 150,46"/>
    <polyline points="118,142 130,154 150,154"/>
  </g>
  <!-- 線の先の丸（回路の点） -->
  <g fill="#ffffff">
    <circle cx="172" cy="62" r="5"/>
    <circle cx="176" cy="100" r="5"/>
    <circle cx="172" cy="138" r="5"/>
    <circle cx="150" cy="46" r="4"/>
    <circle cx="150" cy="154" r="4"/>
  </g>
  <!-- 回路の点の中を、背景の色でくりぬいて輪っかにする -->
  <g fill="#8a66d6">
    <circle cx="172" cy="62" r="2"/>
    <circle cx="176" cy="100" r="2"/>
    <circle cx="172" cy="138" r="2"/>
  </g>

  <!-- ===== フットサルボール ===== -->
  <circle cx="84" cy="100" r="50" fill="#ffffff"/>
  <g clip-path="url(#ball)" fill="#2b2f4a" stroke="#2b2f4a" stroke-width="2.5" stroke-linejoin="round">
    <!-- まん中の五角形 -->
    <polygon points="84,85 98.3,95.4 92.8,112.1 75.2,112.1 69.7,95.4"/>
    <!-- まわりの五角形（ボールのふちで切れる） -->
    <polygon points="84,46 95,54 91,67 77,67 73,54"/>
    <polygon points="132,83 136,96 128,106 116,101 117,88"/>
    <polygon points="113,140 104,148 92,142 96,129 109,128"/>
    <polygon points="55,140 46,129 59,128 72,129 76,142"/>
    <polygon points="36,83 51,88 52,101 40,106 32,96"/>
    <!-- 五角形どうしをつなぐ線 -->
    <g fill="none">
      <line x1="84" y1="85" x2="84" y2="67"/>
      <line x1="98.3" y1="95.4" x2="117" y2="88"/>
      <line x1="92.8" y1="112.1" x2="96" y2="129"/>
      <line x1="75.2" y1="112.1" x2="72" y2="129"/>
      <line x1="69.7" y1="95.4" x2="51" y2="88"/>
    </g>
  </g>
  <!-- ボールのふちの線 -->
  <circle cx="84" cy="100" r="50" fill="none" stroke="#2b2f4a" stroke-width="2.5"/>

  <!-- 右上のきらっとした星（AI っぽさ） -->
  <path d="M160 24 L164 34 L174 38 L164 42 L160 52 L156 42 L146 38 L156 34 Z" fill="#ffffff"/>
  <path d="M182 50 L184 55 L189 57 L184 59 L182 64 L180 59 L175 57 L180 55 Z" fill="#ffffff" opacity="0.8"/>
</svg>
